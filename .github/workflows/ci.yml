name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # JOB 1: Análise Estática (Lint & Type-Check)
  code-quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Lint (ESLint)
        run: npm run lint

      - name: Executar Verificação de Tipos (TypeScript)
        run: npm run type-check

  # JOB 2: Testes Unitários (Jest)
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Jest Unitário
        run: npm run test:unit

  # JOB 3: Testes de Integração (com MySQL Service)
  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tcc_db_test
          MYSQL_USER: tcc_user
          MYSQL_PASSWORD: tcc_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      # Quando você configurar o Prisma/Migrations, descomente a linha abaixo:
      # - name: Rodar Migrações no Banco de Teste
      #   run: npx prisma migrate deploy
      #   env:
      #     DATABASE_URL: mysql://user:user_password@127.0.0.1:3306/sec-app_db

      - name: Executar Testes de Integração
        env:
          DATABASE_URL: mysql://user:user_password@127.0.0.1:3306/sec-app_db
        run: npm run test:integration

  # JOB 4: Build & Testes End-to-End (Playwright / E2E)
  e2e-tests:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      # Quando instalar o Playwright futuramente, descomente:
      # - name: Instalar Navegadores do Playwright
      #   run: npx playwright install --with-deps

      - name: Executar Build da Aplicação Next.js
        run: npm run build

      - name: Executar Testes E2E
        run: npm run test:e2e
