site_name: AEGIS – AI, Ética e Gestão de Integridade em Software
site_description: Documentação do projeto do TCC
repo_url: https://github.com/CedisUnB/SecurityAPP

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo Escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo Claro

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.integrate
    - search.suggest

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition # permite blocos de destaque (nota, aviso, dica)
  - pymdownx.tasklist: # permite checkboxes de verdade nos checklists
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Planejamento:
      - Metodologia de Desenvolvimento:
          - Scrum + XP: planning/development/methodology.md
      - Requisitos:
          - Documento de Requisitos: planning/requirements/docs_requisitos_v2.mdþ
      - Arquitetura:
          - DAS: planning/architecture/software-architecture-document.md
      - Cronograma:
          - Planejado: planning/schedule/planned.md
          - Executado: planning/schedule/executed.md
      - Segurança:
          - Diretrizes: planning/security/guidelines.md
          - Checklist Backend: planning/security/checklist-backend.md
          - Checklist Frontend: planning/security/checklist-frontend.md
          - Checklist API: planning/security/checklist-api.md
          - Checklist Uso de IA: planning/security/checklist-ai-usage.md
          - Referências: planning/security/references.md

  - Processo:
      - Sprints:
          - Sprint 0: process/sprints/sprint_0.md
          - Sprint 1: process/sprints/sprint_1.md
          - Sprint 2: process/sprints/sprint_2.md
          - Sprint 3: process/sprints/sprint_3.md
          - Sprint 4: process/sprints/sprint_4.md
          - Template: process/sprints/template_de_sprint.md
      - Estratégia de Testes: process/strategies/estrategia_testes.md
      - Plano de Métricas do Projeto: process/strategies/estrategia_acompanhamento_projeto.md
      - Avaliação da Feature 1: process/auditoria-seguranca-feature1.md
