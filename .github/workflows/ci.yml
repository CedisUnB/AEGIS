name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ==========================================
  # JOB 1: Análise Estática (Lint & Type-Check)
  # ==========================================
  code-quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Lint (ESLint)
        run: npm run lint

      - name: Executar Verificação de Tipos (TypeScript)
        run: npm run type-check

  # ==========================================
  # JOB 2: Testes Unitários (Jest)
  # ==========================================
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Jest Unitário
        run: npm run test:unit

  # ==========================================
  # JOB 3: Testes de Integração (com MySQL e Migrações)
  # ==========================================
  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tcc_db_test
          MYSQL_USER: tcc_user
          MYSQL_PASSWORD: tcc_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Cliente Prisma
        run: npx prisma generate

      - name: Executar Migrações no Banco de Teste
        env:
          DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_test
        run: npx prisma migrate deploy

      - name: Executar Testes de Integração
        env:
          DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_test
        run: npm run test:integration

  # ==========================================
  # JOB 4: Testes End-to-End (Playwright)
  # ==========================================
  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tcc_db_e2e
          MYSQL_USER: tcc_user
          MYSQL_PASSWORD: tcc_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Cliente Prisma
        run: npx prisma generate

      - name: Executar Migrações para E2E
        env:
          DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_e2e
        run: npx prisma migrate deploy

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Testes E2E
        env:
          DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_e2e
        run: npm run test:e2e

      - name: Salvar Relatório do Playwright (em caso de falha)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
