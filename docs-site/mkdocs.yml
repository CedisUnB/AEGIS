site_name: SecurityApp — Processo e Segurança
site_description: Documentação de arquitetura, processo e diretrizes de desenvolvimento seguro do TCC
repo_url: https://github.com/<seu-usuario-ou-org>/<seu-repo>

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      type: date
      locale: pt-BR

markdown_extensions:
  - admonition          # permite blocos de destaque (nota, aviso, dica)
  - pymdownx.tasklist:  # permite checkboxes de verdade nos checklists
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura:
      - DAS: architecture/software-architecture-document.md
  - Processo:
      - Sprints:
          - Sprint 1: process/sprints/sprint_1.md
          - Sprint 2: process/sprints/sprint_2.md
          - Template: process/sprints/template_de_sprint.md
      - Estratégia de Testes: process/strategies/estrategia_testes.md
      - Plano de Métricas do Projeto: process/strategies/estrategia_acompanhamento_projeto.md
      - Documento de Requisitos: requirements/docs_requisitos_v2.md
  - Segurança:
      - Diretrizes: security/guidelines.md
      - Checklist Backend: security/checklist-backend.md
      - Checklist Frontend: security/checklist-frontend.md
      - Checklist API: security/checklist-api.md
      - Checklist Uso de IA: security/checklist-ai-usage.md
      - Referências: security/references.md